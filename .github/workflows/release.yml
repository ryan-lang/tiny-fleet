name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Extract version tag
        id: tag
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        run: |
          go test -race -v ./...
          GOOS=darwin GOARCH=amd64 go test -c -o /dev/null .
          GOOS=darwin GOARCH=arm64 go test -c -o /dev/null .

      - name: Build Linux Packages
        run: |
          mkdir -p dist
          VERSION="${{ steps.tag.outputs.version }}" ./scripts/build-deb.sh
          cp tiny-fleet_${{ steps.tag.outputs.version }}_amd64.deb dist/
          tar -czf "dist/tiny-fleet_${{ steps.tag.outputs.version }}_linux_amd64.tar.gz" fleet fleet.service README.md QUICKSTART.md

      - name: Build macOS Packages
        run: |
          mkdir -p dist/staging-darwin-amd64 dist/staging-darwin-arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ steps.tag.outputs.version }}" -o dist/staging-darwin-amd64/fleet .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${{ steps.tag.outputs.version }}" -o dist/staging-darwin-arm64/fleet .
          cp io.github.ryan-lang.tiny-fleet.plist README.md QUICKSTART.md dist/staging-darwin-amd64/
          cp io.github.ryan-lang.tiny-fleet.plist README.md QUICKSTART.md dist/staging-darwin-arm64/
          (cd dist/staging-darwin-amd64 && tar -czf "../tiny-fleet_${{ steps.tag.outputs.version }}_darwin_amd64.tar.gz" fleet io.github.ryan-lang.tiny-fleet.plist README.md QUICKSTART.md)
          (cd dist/staging-darwin-arm64 && tar -czf "../tiny-fleet_${{ steps.tag.outputs.version }}_darwin_arm64.tar.gz" fleet io.github.ryan-lang.tiny-fleet.plist README.md QUICKSTART.md)
          rm -rf dist/staging-darwin-amd64 dist/staging-darwin-arm64

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum tiny-fleet_* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tiny Fleet ${{ steps.tag.outputs.tag }}
          files: |
            dist/tiny-fleet_${{ steps.tag.outputs.version }}_amd64.deb
            dist/tiny-fleet_${{ steps.tag.outputs.version }}_linux_amd64.tar.gz
            dist/tiny-fleet_${{ steps.tag.outputs.version }}_darwin_amd64.tar.gz
            dist/tiny-fleet_${{ steps.tag.outputs.version }}_darwin_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
